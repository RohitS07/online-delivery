# One uv workspace for every Python app and package. The harness's own scripts need only the standard library.
# The workspace root is not a package; it only pins the Python version and the dev tools.
[project]
name = "online-delivery-workspace"
version = "0.0.0"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
